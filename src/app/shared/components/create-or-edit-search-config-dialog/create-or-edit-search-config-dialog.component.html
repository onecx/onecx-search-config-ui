<form [formGroup]="searchConfigFormGroup" class="searchConfigDialog">
  <p-floatlabel variant="on">
    <p-autocomplete
      inputId="searchConfigName"
      [typeahead]="true"
      [completeOnFocus]="true"
      [minQueryLength]="0"
      [suggestions]="nameSuggestions"
      [appendTo]="appendTo"
      [panelStyleClass]="panelStyleClass"
      [fluid]="true"
      formControlName="searchConfigName"
      (completeMethod)="onNameQuery($event)"
    ></p-autocomplete>
    <label for="searchConfigName">{{ 'SEARCH_CONFIG.SAVE_AS_DIALOG.NAME' | translate }}</label>
  </p-floatlabel>

  @if (overwritePending) {
    <p-message severity="warn" role="alert" aria-live="polite" class="sc-search-config-overwrite-warning">
      {{ overwriteWarning }}
    </p-message>
  }

  @if (nameExists) {
    <p-message severity="error" role="alert" aria-live="polite" class="sc-search-config-name-exists">
      {{ nameExistsMessage }}
    </p-message>
  }

  <div class="sc-search-config-option">
    <p-checkbox inputId="saveInputValuesId" formControlName="saveInputValues" [binary]="true"></p-checkbox>
    <label for="saveInputValuesId">{{ 'SEARCH_CONFIG.SAVE_AS_DIALOG.SAVE_CRITERIA' | translate }}</label>
  </div>

  <div class="sc-search-config-option">
    <p-checkbox inputId="saveColumnsId" formControlName="saveColumns" [binary]="true"></p-checkbox>
    <label for="saveColumnsId">
      {{ 'SEARCH_CONFIG.SAVE_AS_DIALOG.SAVE_COLUMNS' | translate }}
      @if (frozeColumnSaveOption) {
        {{ frozeColumnSaveOptionExplanation | translate }}
      }
    </label>
  </div>
</form>
